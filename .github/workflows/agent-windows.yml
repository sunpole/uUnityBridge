name: P0008 Windows agent tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - 'scripts/Stage-Unity-QA.ps1'
      - 'src/UnityControlUi.cs'
      - 'src/MainForm.cs'
      - '.github/workflows/agent-windows.yml'
      - 'docs/P0008_AGENT_FOUNDATION.md'
  push:
    branches: [main, feature/unity-mvp-editor-foundation]
    paths:
      - 'agent/**'
      - 'scripts/Stage-Unity-QA.ps1'
      - 'src/UnityControlUi.cs'
      - 'src/MainForm.cs'
      - '.github/workflows/agent-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test protocol with mocked GitHub, no user file access
        shell: pwsh
        run: |
          dotnet run --project ./agent/uUnityBridge.Agent.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Agent protocol self-tests failed.' }
      - name: Isolated typed Unity CLI policy (no Editor or user files)
        shell: pwsh
        run: |
          dotnet run --project ./tests/uUnityBridge.UnityBridgeTests/uUnityBridge.UnityBridgeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Unity CLI policy tests failed.' }
      - name: Verify isolated Unity QA launcher and no-production-poll safeguards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = (Resolve-Path './scripts/Stage-Unity-QA.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Unity QA staging script has parser errors' }
          $agentCode = Get-Content ./agent/Program.cs -Raw
          $desktopCode = Get-Content ./src/MainForm.cs -Raw
          $ipcCode = Get-Content ./src/UnityControlUi.cs -Raw
          if (!$agentCode.Contains('--serve-qa') -or
              !$agentCode.Contains('qaServe ? Task.CompletedTask') -or
              !$desktopCode.Contains('if (IsUnityQa)') -or
              !$ipcCode.Contains('uUnityBridge.agent.qa.v1')) {
            throw 'QA isolation contract removed from Agent or Desktop'
          }
          Write-Host 'PASS: QA parser and separate current-user pipe / no GitHub relay'
      - name: Verify immutable Unity Git package metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = './unity/Packages/com.sunpole.uunitybridge'
          $assets = @('Editor', 'Editor/UnityBridgeEditorCommands.cs',
            'Editor/UnityBridgePolicy.cs', 'Editor/uUnityBridge.Editor.asmdef',
            'package.json', 'README.md')
          $guids = @{}
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath "$root/$asset")) { throw "Missing Unity asset: $asset" }
            $meta = "$root/$asset.meta"
            if (!(Test-Path -LiteralPath $meta -PathType Leaf)) {
              throw "Missing immutable Unity package .meta: $asset"
            }
            $content = Get-Content -LiteralPath $meta -Raw
            $match = [regex]::Match($content, '(?m)^guid: ([0-9a-f]{32})\r?$')
            if (!$match.Success) { throw "Invalid Unity .meta: $asset" }
            $id = $match.Groups[1].Value
            if ($guids.ContainsKey($id)) { throw "Duplicated Unity GUID: $id" }
            $guids[$id] = $true
          }
          Write-Host 'PASS: six immutable Unity package .meta files and unique GUIDs'
      - name: Publish standalone agent preview to CI artifacts only
        shell: pwsh
        run: |
          dotnet publish ./agent/uUnityBridge.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o ./dist/agent-preview
          if ($LASTEXITCODE -ne 0) { throw 'Agent publish failed.' }
          if (-not (Test-Path ./dist/agent-preview/uUnityBridge.Agent.exe)) { throw 'Agent executable missing.' }
      - name: Verify standard-user agent diagnostic without opening IPC
        shell: pwsh
        run: |
          $diagnostic = & ./dist/agent-preview/uUnityBridge.Agent.exe --diagnose | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              $diagnostic.isElevated -isnot [bool] -or
              $diagnostic.version -ne '0.2.1-preview') {
            throw 'Agent diagnostic output is invalid.'
          }
          Write-Host "PASS: identity diagnostic; elevated=$($diagnostic.isElevated)"
      - name: Smoke test published EXE without running a service
        shell: pwsh
        run: |
          & ./dist/agent-preview/uUnityBridge.Agent.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Published agent self-test failed.' }
      - name: Local IPC end-to-end test (same Windows user, no open port)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path ./dist/agent-preview/uUnityBridge.Agent.exe).Path
          $identity = (& $exe --diagnose | ConvertFrom-Json)
          if ($identity.isElevated) {
            # Hosted Windows runners can be elevated; this test must then
            # prove the server refuses startup, not weaken its protections.
            $blocked = & $exe --serve 2>&1 | Out-String
            if ($LASTEXITCODE -ne 5 -or $blocked -notmatch 'BLOCKED') {
              throw 'Elevated agent did not refuse to start.'
            }
            Write-Host 'PASS: elevated Windows runner correctly blocked from serving.'
            return
          }
          $agent = Start-Process -FilePath $exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          try {
            $reply = $null
            for ($attempt = 0; $attempt -lt 8; $attempt++) {
              Start-Sleep -Milliseconds 500
              $output = & $exe --request health 2>$null
              if ($LASTEXITCODE -eq 0) {
                $reply = $output | ConvertFrom-Json
                break
              }
            }
            if ($null -eq $reply -or $reply.status -ne 'ok' -or $reply.adminToolsEnabled -ne $false) {
              throw 'Local named-pipe health request failed.'
            }
            $invalid = (& $exe --request powershell | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $invalid.error -ne 'unknown_action') {
              throw 'Unapproved remote command unexpectedly accepted.'
            }
            Write-Host 'PASS: local IPC, health and denied PowerShell request.'
          }
          finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
          }
      - name: Runtime isolated QA Agent and QA Named Pipe E2E (no production mutation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path ./dist/agent-preview/uUnityBridge.Agent.exe).Path
          $saved = [Environment]::GetEnvironmentVariable('UUB_UNITY_QA', 'Process')
          $qa = $null
          try {
            Remove-Item Env:UUB_UNITY_QA -ErrorAction SilentlyContinue
            & $exe --serve-qa 2>$null | Out-Null
            if ($LASTEXITCODE -ne 2) {
              throw 'QA service started without explicit QA flag'
            }
            $env:UUB_UNITY_QA = '1'
            $identity = & $exe --diagnose | ConvertFrom-Json
            if ($identity.isElevated) {
              & $exe --serve-qa 2>$null | Out-Null
              if ($LASTEXITCODE -ne 5) {
                throw 'Elevated QA service bypassed explicit privilege restriction'
              }
              Write-Host 'PASS: hosted runner is elevated, QA safely blocked (local E2E still required)'
            }
            else {
              $qa = Start-Process -FilePath $exe -ArgumentList '--serve-qa' -PassThru -WindowStyle Hidden
              $response = $null
              for ($attempt = 0; $attempt -lt 12; $attempt++) {
                Start-Sleep -Milliseconds 500
                if ($qa.HasExited) {
                  throw "QA Agent exited before health handshake, exit code $($qa.ExitCode)"
                }
                $raw = & $exe --request health 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $response = $raw | ConvertFrom-Json
                  break
                }
              }
              if ($null -eq $response -or $response.status -ne 'ok' -or
                  $response.adminToolsEnabled -ne $false -or
                  $response.transport -ne 'current-user-named-pipe') {
                throw 'QA Named Pipe health handshake failed'
              }
              $denied = & $exe --request powershell | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $denied.error -ne 'unknown_action') {
                throw 'QA IPC accepted an unapproved command'
              }
              Write-Host 'PASS: QA --serve-qa + isolated QA Named Pipe health + denied command'
            }
          }
          finally {
            if ($qa -and -not $qa.HasExited) {
              Stop-Process -Id $qa.Id -Force -ErrorAction SilentlyContinue
            }
            if ($null -eq $saved) {
              Remove-Item Env:UUB_UNITY_QA -ErrorAction SilentlyContinue
            }
            else { $env:UUB_UNITY_QA = $saved }
          }
          # The elevated-runner DENY test intentionally returns native exit 5.
          # GitHub's pwsh wrapper fails on a residual nonzero LASTEXITCODE even
          # when the denial was expected and explicitly asserted above.
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: uUnityBridge-agent-p0008-preview
          path: dist/agent-preview/uUnityBridge.Agent.exe
          if-no-files-found: error
