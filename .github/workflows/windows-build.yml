name: Windows desktop build (uUnityBridge)

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify QA cleanup script syntax on Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = (Resolve-Path './scripts/Clean-Local-QA.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw 'Unsafe or invalid cleanup script syntax'
          }
          $script = Get-Content -LiteralPath $path -Raw
          foreach ($allowed in @('uUnityBridge.pdb','uUnityBridge.Updater.pdb')) {
            if (-not $script.Contains($allowed)) {
              throw "Expected known debug symbol missing: $allowed"
            }
          }
          if ($script.Contains("'*.pdb'")) {
            throw 'Wildcard PDB deletion is not permitted'
          }
          Write-Host 'PASS: cleanup parser and exact PDB allowlist'
      - name: Publish portable x64 EXE
        shell: pwsh
        run: |
          dotnet publish ./src/uUnityBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist/win-x64
          if (-not (Test-Path ./dist/win-x64/uUnityBridge.exe)) { throw 'Missing uUnityBridge.exe' }
          if ((Get-Item ./dist/win-x64/uUnityBridge.exe).Length -ge 150000000) { throw 'Main EXE exceeds v0.4.0 updater 150MB limit' }
          dotnet publish ./updater/uUnityBridge.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist/win-x64
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path ./dist/win-x64/uUnityBridge.Updater.exe)) { throw 'Missing updater EXE' }
          $sha = (Get-FileHash ./dist/win-x64/uUnityBridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path ./dist/win-x64).Path 'uUnityBridge.exe.sha256'), $sha + '  uUnityBridge.exe' + [Environment]::NewLine)
      - name: Test patch state machine and ledger
        shell: pwsh
        run: |
          dotnet run --project ./tests/uUnityBridge.Tests/uUnityBridge.Tests.csproj -c Release
      - name: Verify Unity immutable Git package metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = './unity/Packages/com.sunpole.uunitybridge'
          $assets = @('Editor', 'Editor/UnityBridgeEditorCommands.cs',
            'Editor/UnityBridgePolicy.cs', 'Editor/uUnityBridge.Editor.asmdef',
            'package.json', 'README.md')
          $guids = @{}
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath "$root/$asset")) { throw "Missing Unity asset: $asset" }
            $meta = "$root/$asset.meta"
            if (!(Test-Path -LiteralPath $meta -PathType Leaf)) {
              throw "Missing Unity .meta: $asset"
            }
            $content = Get-Content -LiteralPath $meta -Raw
            $match = [regex]::Match($content, '(?m)^guid: ([0-9a-f]{32})
        uses: actions/upload-artifact@v4
        with:
          name: uUnityBridge-windows-x64-ci
          path: dist/win-x64/
          if-no-files-found: error
)
            if (!$match.Success) { throw "Invalid Unity .meta GUID: $asset" }
            $id = $match.Groups[1].Value
            if ($guids.ContainsKey($id)) { throw "Duplicate Unity .meta GUID: $id" }
            $guids[$id] = $true
          }
          Write-Host 'PASS: six Unity immutable package .meta assets with unique GUIDs'
      - name: Test and publish matching QA Agent for exactly the same commit
        shell: pwsh
        run: |
          dotnet run --project ./agent/uUnityBridge.Agent.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'QA Agent self-test failed' }
          dotnet run --project ./tests/uUnityBridge.UnityBridgeTests/uUnityBridge.UnityBridgeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Unity CLI + Editor diagnostic regression tests failed' }
          dotnet publish ./agent/uUnityBridge.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o ./dist/agent-preview
          if ($LASTEXITCODE -ne 0 -or !(Test-Path ./dist/agent-preview/uUnityBridge.Agent.exe)) {
            throw 'Matching QA Agent artifact missing'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: uUnityBridge-agent-p0008-preview
          path: dist/agent-preview/uUnityBridge.Agent.exe
          if-no-files-found: error
      - name: Upload unsigned build artifact for testing
        uses: actions/upload-artifact@v4
        with:
          name: uUnityBridge-windows-x64-ci
          path: dist/win-x64/
          if-no-files-found: error
