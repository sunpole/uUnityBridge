name: Windows desktop build (uUnityBridge)

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify QA cleanup script syntax on Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = (Resolve-Path './scripts/Clean-Local-QA.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw 'Unsafe or invalid cleanup script syntax'
          }
          $script = Get-Content -LiteralPath $path -Raw
          foreach ($allowed in @('uUnityBridge.pdb','uUnityBridge.Updater.pdb')) {
            if (-not $script.Contains($allowed)) {
              throw "Expected known debug symbol missing: $allowed"
            }
          }
          if ($script.Contains("'*.pdb'")) {
            throw 'Wildcard PDB deletion is not permitted'
          }
          Write-Host 'PASS: cleanup parser and exact PDB allowlist'
      - name: Publish portable x64 EXE
        shell: pwsh
        run: |
          dotnet publish ./src/uUnityBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist/win-x64
          if (-not (Test-Path ./dist/win-x64/uUnityBridge.exe)) { throw 'Missing uUnityBridge.exe' }
          if ((Get-Item ./dist/win-x64/uUnityBridge.exe).Length -ge 150000000) { throw 'Main EXE exceeds v0.4.0 updater 150MB limit' }
          dotnet publish ./updater/uUnityBridge.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist/win-x64
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path ./dist/win-x64/uUnityBridge.Updater.exe)) { throw 'Missing updater EXE' }
          $sha = (Get-FileHash ./dist/win-x64/uUnityBridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path ./dist/win-x64).Path 'uUnityBridge.exe.sha256'), $sha + '  uUnityBridge.exe' + [Environment]::NewLine)
      - name: Test patch state machine and ledger
        shell: pwsh
        run: |
          dotnet run --project ./tests/uUnityBridge.Tests/uUnityBridge.Tests.csproj -c Release
      - name: Isolated agent upgrade QA (no user files, no network or service)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project ./tests/uUnityBridge.UpgradeTests/uUnityBridge.UpgradeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'P0010 isolated upgrade fault tests failed.' }
      - name: Reject unapproved agent bootstrap without touching user files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = (Resolve-Path './dist/win-x64/uUnityBridge.Updater.exe').Path
          $missing = Join-Path $env:RUNNER_TEMP 'uUnityBridge.Agent.exe'
          if (Test-Path $missing) { throw 'Unexpected test target exists.' }
          $result = Start-Process -FilePath $helper -ArgumentList @('agent-apply', $missing, ('0' * 64), ('1' * 32)) -Wait -PassThru
          if ($result.ExitCode -ne 1 -or (Test-Path $missing)) { throw 'Unapproved bootstrap was not blocked.' }
          Write-Host 'PASS: unapproved agent update blocked with no target created.'
      - name: Package release-style ZIP for deployment QA (CI artifact only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Resolve-Path './dist/win-x64').Path
          $zip = Join-Path $dir 'uUnityBridge-windows-x64.zip'
          Compress-Archive -LiteralPath (Join-Path $dir 'uUnityBridge.exe'), (Join-Path $dir 'uUnityBridge.Updater.exe') -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($names.Count -ne 2 -or $names -notcontains 'uUnityBridge.exe' -or $names -notcontains 'uUnityBridge.Updater.exe') {
              throw 'Deployment ZIP layout is invalid'
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(($zip + '.sha256'), $hash + '  uUnityBridge-windows-x64.zip' + [Environment]::NewLine)
      - name: Upload unsigned build artifact for testing
        uses: actions/upload-artifact@v4
        with:
          name: uUnityBridge-windows-x64-ci
          path: dist/win-x64/
          if-no-files-found: error
