name: Publish verified Windows EXE release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact project version (e.g. 0.4.0). Runs only from main."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate requested version and build both executables
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          [xml]$project = Get-Content './src/uUnityBridge.csproj'
          if ($project.Project.PropertyGroup.Version -ne $env:RELEASE_VERSION) { throw 'Project version does not match release input' }
          dotnet publish ./src/uUnityBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Main build failed' }
          if ((Get-Item ./dist/win-x64/uUnityBridge.exe).Length -ge 150000000) { throw 'Main EXE exceeds v0.4.0 updater 150MB limit' }
          dotnet publish ./updater/uUnityBridge.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Updater build failed' }
          dotnet run --project ./tests/uUnityBridge.Tests/uUnityBridge.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          $sha = (Get-FileHash './dist/win-x64/uUnityBridge.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path ./dist/win-x64).Path 'uUnityBridge.exe.sha256'), $sha + '  uUnityBridge.exe' + [Environment]::NewLine)
          if (!(Test-Path './dist/win-x64/uUnityBridge.Updater.exe')) { throw 'Updater EXE missing' }
          $dir = (Resolve-Path './dist/win-x64').Path
          $zip = Join-Path $dir 'uUnityBridge-windows-x64.zip'
          Compress-Archive -LiteralPath (Join-Path $dir 'uUnityBridge.exe'), (Join-Path $dir 'uUnityBridge.Updater.exe') -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($names.Count -ne 2 -or $names -notcontains 'uUnityBridge.exe' -or $names -notcontains 'uUnityBridge.Updater.exe') {
              throw 'Release ZIP has an unexpected file list'
            }
          } finally { $archive.Dispose() }
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(($zip + '.sha256'), $zipSha + '  uUnityBridge-windows-x64.zip' + [Environment]::NewLine)
      - name: Publish immutable-target release assets (never overwrite existing release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag = 'v' + $env:RELEASE_VERSION
          gh release create $tag './dist/win-x64/uUnityBridge.exe' './dist/win-x64/uUnityBridge.Updater.exe' './dist/win-x64/uUnityBridge.exe.sha256' './dist/win-x64/uUnityBridge-windows-x64.zip' './dist/win-x64/uUnityBridge-windows-x64.zip.sha256' -R "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "uUnityBridge $tag" --notes "Tested self-contained Windows x64 build. Download BOTH EXEs into a new folder for bootstrap. Auto-update applies only from later stable releases, verifying SHA256 and keeping a rollback backup."
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
